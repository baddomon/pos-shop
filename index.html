<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POS ร้านกับข้าว</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1f2328;--mu:#6b7280;--ac:#e8590c;--acx:#fff;--ln:#e5e2da;--ok:#2f9e44;--bad:#c92a2a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#222428;--tx:#ececec;--mu:#9aa0a6;--ac:#ff8a3d;--acx:#1a1a1a;--ln:#33363b;--ok:#51cf66;--bad:#ff6b6b}}
:root[data-theme="dark"]{--bg:#17181a;--card:#222428;--tx:#ececec;--mu:#9aa0a6;--ac:#ff8a3d;--acx:#1a1a1a;--ln:#33363b;--ok:#51cf66;--bad:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:150px}
.wrap{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:18px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.item{position:relative;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px 10px;min-height:88px;text-align:center;font:inherit;color:var(--tx);cursor:pointer}
.item:active{transform:scale(.97)}
.item b{display:block;font-size:17px}.item span{color:var(--mu)}
.badge{position:absolute;top:-6px;right:-6px;background:var(--ac);color:var(--acx)!important;border-radius:99px;min-width:26px;padding:1px 7px;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--ln);padding:10px 14px}
.bar .in{max-width:560px;margin:0 auto}
.lines{max-height:96px;overflow:auto;margin-bottom:8px;font-size:15px}
.ln{display:flex;align-items:center;gap:8px;padding:2px 0}.ln .n{flex:1}
.q{width:30px;height:30px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;font-size:18px}
.row{display:flex;gap:8px;align-items:center}
.tot{flex:1;font-size:26px;font-weight:700}
.btn{border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:700;background:var(--ac);color:var(--acx);cursor:pointer}
.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--ln);font-weight:600}
.btn.s{padding:7px 12px;font-size:14px}.btn.d{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;height:58px;border:0;background:none;color:var(--mu);font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:34px;font-weight:700}.mu{color:var(--mu);font-size:14px}
table{width:100%;border-collapse:collapse}td{padding:6px 0;border-bottom:1px solid var(--ln)}td:last-child{text-align:right}
input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;width:100%}
.mrow{display:flex;gap:6px;margin-bottom:8px;align-items:center}.mrow input:nth-child(2){width:90px}
.mrow.off input{opacity:.45}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="bar" class="bar"></div>
<div class="tabs" id="tabs"></div>
<div id="ov"></div>
<script>
var S,cart={},tab='sell',armed=null,dl=null;
var KEY='pos-stall-v1';
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}
return{n:10,menu:[{id:1,name:'ข้าวผัด',price:50,off:0},{id:2,name:'ผัดกะเพรา',price:55,off:0},{id:3,name:'ไข่เจียว',price:40,off:0},{id:4,name:'น้ำเปล่า',price:10,off:0}],bills:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
S=load();
var $=function(s){return document.querySelector(s)};
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fm(n){return Number(n).toLocaleString('th-TH')}
function dkey(t){return new Date(t).toLocaleDateString('sv')}
function cartLines(){return S.menu.filter(function(m){return cart[m.id]}).map(function(m){return{id:m.id,n:m.name,p:m.price,q:cart[m.id]}})}
function cartTotal(){return cartLines().reduce(function(a,l){return a+l.p*l.q},0)}
function add(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];render()}

function render(){
 var wn=S.bills.filter(function(b){return b.st=='w'}).length;var t=[['sell','ขาย'],['q','คิว'+(wn?' ('+wn+')':'')],['sum','สรุปยอด'],['menu','เมนู']];
 $('#tabs').innerHTML=t.map(function(x){return'<button class="'+(tab==x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('');
 $('#bar').className='bar'+(tab=='sell'?'':' hide');
 $('#app').innerHTML=tab=='sell'?vSell():tab=='q'?vQ():tab=='sum'?vSum():vMenu();
 if(tab=='sell')renderBar();
}
function go(x){tab=x;armed=null;render();window.scrollTo(0,0)}

function vSell(){
 var on=S.menu.filter(function(m){return!m.off});
 if(!on.length)return'<h1>ขาย</h1><p class="mu">ยังไม่มีเมนูที่พร้อมขาย ไปเพิ่มที่แท็บ "เมนู"</p>';
 return'<h1>แตะเมนูเพื่อเพิ่มจาน</h1><div class="grid">'+on.map(function(m){
  return'<button class="item" onclick="add('+m.id+',1)"><b>'+esc(m.name)+'</b><span>฿'+fm(m.price)+'</span>'+(cart[m.id]?'<span class="badge">'+cart[m.id]+'</span>':'')+'</button>'}).join('')+'</div>';
}
function renderBar(){
 var L=cartLines(),tt=cartTotal();
 $('#bar').innerHTML='<div class="in">'+(L.length?'<div class="lines">'+L.map(function(l){
  return'<div class="ln"><span class="n">'+esc(l.n)+'</span><button class="q" onclick="add('+l.id+',-1)">−</button><b>'+l.q+'</b><button class="q" onclick="add('+l.id+',1)">+</button><span style="width:56px;text-align:right">'+fm(l.p*l.q)+'</span></div>'}).join('')+'</div>':'')
 +'<div class="row"><div class="tot">฿'+fm(tt)+'</div>'+(L.length?'<button class="btn g" onclick="cart={};render()">ล้าง</button>':'')+'<button class="btn" '+(L.length?'':'disabled')+' onclick="pay()">ชำระเงิน</button></div></div>';
}

function pay(){
 var tt=cartTotal();
 $('#ov').innerHTML='<div class="ov"><div class="sheet"><div class="mu">ยอดที่ต้องชำระ</div><div class="big">฿'+fm(tt)+'</div>'
 +'<div class="chips"><button class="btn g s" onclick="setPaid('+tt+')">พอดี</button>'+[20,50,100,500,1000].map(function(v){return'<button class="btn g s" onclick="setPaid('+v+')">'+v+'</button>'}).join('')+'</div>'
 +'<input id="paid" type="number" inputmode="decimal" placeholder="เงินที่รับ" oninput="chg()">'
 +'<div class="row" style="margin:12px 0"><div class="mu" style="flex:1">เงินทอน</div><div class="big" id="chg" style="font-size:28px">฿0</div></div>'
 +'<div class="row"><button class="btn g" style="flex:1" onclick="$(\'#ov\').innerHTML=\'\'">ยกเลิก</button><button class="btn" style="flex:2" onclick="confirmPay()">บันทึกการขาย</button></div></div></div>';
 setPaid(tt);
}
function setPaid(v){$('#paid').value=v;chg()}
function chg(){var tt=cartTotal(),p=parseFloat($('#paid').value)||0,c=p-tt;var e=$('#chg');e.textContent=c<0?'ขาด ฿'+fm(-c):'฿'+fm(c);e.style.color=c<0?'var(--bad)':'var(--ok)'}
function confirmPay(){
 var tt=cartTotal(),p=parseFloat($('#paid').value)||0;
 if(p<tt){return}
 var td=dkey(Date.now()),qn=S.bills.reduce(function(a,b){return dkey(b.t)==td?Math.max(a,b.q||0):a},0)+1;
 S.bills.push({id:S.n++,t:Date.now(),q:qn,st:'w',items:cartLines().map(function(l){return{n:l.n,p:l.p,q:l.q}}),total:tt,paid:p});
 save();cart={};
 $('#ov').innerHTML='<div class="ov"><div class="sheet" style="text-align:center"><div class="mu">คิวที่</div><div class="big" style="font-size:72px">'+qn+'</div><div class="mu">เงินทอน ฿'+fm(p-tt)+'</div><button class="btn" style="width:100%;margin-top:14px" onclick="$(\'#ov\').innerHTML=\'\'">ตกลง</button></div></div>';render();
}

function vSum(){
 var today=dkey(Date.now()),B=S.bills.filter(function(b){return dkey(b.t)==today}),sum=0,agg={};
 B.forEach(function(b){sum+=b.total;b.items.forEach(function(i){var a=agg[i.n]||(agg[i.n]={q:0,a:0});a.q+=i.q;a.a+=i.q*i.p})});
 var names=Object.keys(agg).sort(function(a,b){return agg[b].a-agg[a].a});
 return'<h1>สรุปยอดวันนี้</h1><div class="card"><div class="mu">ยอดขายรวม</div><div class="big">฿'+fm(sum)+'</div><div class="mu">'+B.length+' บิล</div></div>'
 +'<div class="card"><b>แยกตามเมนู</b>'+(names.length?'<table>'+names.map(function(n){return'<tr><td>'+esc(n)+' × '+agg[n].q+'</td><td>฿'+fm(agg[n].a)+'</td></tr>'}).join('')+'</table>':'<p class="mu">ยังไม่มีรายการขาย</p>')+'</div>'
 +'<div class="card"><b>บิลวันนี้</b>'+(B.length?B.slice().reverse().map(function(b){
   return'<div class="row" style="padding:8px 0;border-bottom:1px solid var(--ln)"><div style="flex:1"><div>คิว '+(b.q||'-')+' · '+new Date(b.t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})+' · <b>฿'+fm(b.total)+'</b></div><div class="mu">'+b.items.map(function(i){return esc(i.n)+'×'+i.q}).join(', ')+'</div></div><button class="btn s '+(armed=='b'+b.id?'d':'g')+'" onclick="delBill('+b.id+')">'+(armed=='b'+b.id?'แตะอีกครั้งเพื่อลบ':'ยกเลิกบิล')+'</button></div>'}).join(''):'<p class="mu">ยังไม่มีบิล</p>')+'</div>'
 +'<div class="card"><b>สำรองข้อมูล</b><p class="mu">เก็บไฟล์สำรองไว้ในมือถือหรือส่งเข้า LINE/อีเมลตัวเอง เผื่อเครื่องมีปัญหา</p>'
 +'<div class="row" style="flex-wrap:wrap"><button class="btn s" onclick="exp(\'json\')">สำรองทั้งหมด (.json)</button><button class="btn g s" onclick="exp(\'csv\')">ยอดขาย (.csv)</button><button class="btn g s" onclick="$(\'#f\').click()">กู้คืน</button></div>'
 +'<input type="file" id="f" accept=".json,application/json" class="hide" onchange="restore(this)">'
 +'<textarea id="tx" class="hide" rows="5" style="margin-top:10px" placeholder="คัดลอกข้อความนี้เก็บไว้ หรือวางข้อมูลสำรองที่นี่"></textarea>'
 +'<button id="rt" class="btn g s hide" style="margin-top:8px" onclick="restoreText()">กู้คืนจากข้อความ</button><div id="msg" class="mu" style="margin-top:8px"></div></div>';
}
function vQ(){
 var td=dkey(Date.now()),T=S.bills.filter(function(b){return dkey(b.t)==td}),W=T.filter(function(b){return b.st=='w'}),D=T.filter(function(b){return b.st=='d'}).slice(-5).reverse();
 function card(b,w){return'<div class="card"><div class="row"><div class="big" style="width:64px">'+b.q+'</div><div style="flex:1">'+b.items.map(function(i){return esc(i.n)+' × '+i.q}).join('<br>')+'</div><button class="btn'+(w?'':' g')+' s" onclick="setSt('+b.id+',\''+(w?'d':'w')+'\')">'+(w?'เสร็จแล้ว':'ย้อนกลับ')+'</button></div></div>'}
 return'<h1>คิวที่รอ ('+W.length+')</h1>'+(W.length?W.map(function(b){return card(b,1)}).join(''):'<p class="mu">ไม่มีคิวค้าง</p>')+(D.length?'<p class="mu">เสร็จล่าสุด</p>'+D.map(function(b){return card(b,0)}).join(''):'');
}
function setSt(id,s){var b=S.bills.find(function(x){return x.id==id});if(b){b.st=s;save();render()}}
function delBill(id){if(armed!='b'+id){armed='b'+id;render();return}S.bills=S.bills.filter(function(b){return b.id!=id});armed=null;save();render()}

function msg(t){var e=$('#msg');if(e)e.textContent=t}
function csv(){
 var r=['บิล,วันที่,เวลา,เมนู,จำนวน,ราคา,รวมบิล'];
 S.bills.forEach(function(b){var d=new Date(b.t);b.items.forEach(function(i){r.push([b.id,dkey(b.t),d.toLocaleTimeString('sv'),'"'+i.n.replace(/"/g,'""')+'"',i.q,i.p,b.total].join(','))})});
 return'\ufeff'+r.join('\n');
}
async function exp(kind){
 var data=kind=='json'?JSON.stringify(S):csv(),name='pos-'+dkey(Date.now())+'.'+kind;
 try{
  if(dl===null){dl=await claude.use('downloads')||false}
  if(dl){await dl.save({filename:name,data:data});msg('บันทึกไฟล์แล้ว');return}
 }catch(e){if(e&&e.code=='declined'){msg('ยกเลิกการบันทึก');return}}
 var t=$('#tx');t.classList.remove('hide');$('#rt').classList.remove('hide');t.value=data;t.select();
 msg('ดาวน์โหลดไม่ได้ในเครื่องนี้ คัดลอกข้อความด้านล่างไปเก็บไว้ (เช่น ส่งเข้า LINE ตัวเอง)');
}
function apply(txt){
 try{var o=JSON.parse(txt);if(!o||!Array.isArray(o.menu)||!Array.isArray(o.bills))throw 0;S=o;S.n=S.n||(S.bills.length+10);save();render();msg('กู้คืนข้อมูลแล้ว')}catch(e){msg('ไฟล์ไม่ถูกต้อง กู้คืนไม่ได้')}
}
function restore(el){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){apply(r.result)};r.readAsText(f)}
function restoreText(){apply($('#tx').value)}

function vMenu(){
 return'<h1>จัดการเมนูและราคา</h1>'+S.menu.map(function(m){
  return'<div class="mrow'+(m.off?' off':'')+'"><input value="'+esc(m.name)+'" onchange="upd('+m.id+',\'name\',this.value)"><input type="number" inputmode="decimal" value="'+m.price+'" onchange="upd('+m.id+',\'price\',this.value)">'
  +'<button class="btn g s" onclick="tog('+m.id+')">'+(m.off?'ขายต่อ':'หมด')+'</button><button class="btn s '+(armed=='m'+m.id?'d':'g')+'" onclick="delMenu('+m.id+')">'+(armed=='m'+m.id?'ลบ?':'✕')+'</button></div>'}).join('')
 +'<button class="btn" style="width:100%;margin-top:6px" onclick="addMenu()">+ เพิ่มเมนู</button><p class="mu">กด "หมด" เพื่อซ่อนเมนูชั่วคราว โดยไม่ต้องลบ</p>';
}
function upd(id,k,v){var m=S.menu.find(function(x){return x.id==id});if(!m)return;if(k=='price'){v=Math.max(0,parseFloat(v)||0)}else{v=v.trim()||m.name}m[k]=v;save();render()}
function tog(id){var m=S.menu.find(function(x){return x.id==id});m.off=m.off?0:1;delete cart[id];save();render()}
function delMenu(id){if(armed!='m'+id){armed='m'+id;render();return}S.menu=S.menu.filter(function(m){return m.id!=id});delete cart[id];armed=null;save();render()}
function addMenu(){S.menu.push({id:Date.now(),name:'เมนูใหม่',price:0,off:0});save();render()}
render();
</script>
</body>
</html>
